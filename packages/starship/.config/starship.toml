# Compact Catppuccin prompt: context on the left, runtimes on the right.
format = "$directory$git_branch$git_status$line_break$character"
right_format = "$cmd_duration$nodejs$python$aws"
add_newline = true
palette = "catppuccin_mocha"

[directory]
style = "bold lavender"
truncation_length = 4
truncate_to_repo = false
read_only = " "

[git_branch]
symbol = " "
style = "mauve"
format = "on [$symbol$branch]($style) "

[git_status]
style = "red"
format = "[$all_status$ahead_behind]($style) "

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[cmd_duration]
min_time = 750
style = "yellow"
format = "[$duration]($style) "

[nodejs]
symbol = " "
style = "green"
format = "[$symbol($version)]($style) "

[python]
symbol = " "
style = "yellow"
format = "[$symbol$virtualenv]($style) "

[aws]
symbol = " "
style = "peach"
format = "[$symbol$profile]($style) "

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
